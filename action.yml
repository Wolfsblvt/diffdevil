# Generated from src/actions/surface.ts by npm run build:actions.
name: diffdevil
description: Measure pull-request changes, evaluate rules, and reconcile selected labels and comments.
author: Wolfsblvt
inputs:
  github-token:
    description: GitHub credential for the selected repository. A token does not enable writes.
    required: false
    default: ${{ github.token }}
  repository:
    description: Target owner/repository. Defaults to the workflow repository.
    required: false
  pull-request:
    description: Positive PR number. Defaults to a PR event or PR issue-comment event.
    required: false
  source:
    description: github-api (default), or git for controlled local comparison of the live PR revisions.
    required: false
  git-cwd:
    description: "Checkout directory for source: git. Defaults to GITHUB_WORKSPACE."
    required: false
  mode:
    description: "Root operation: analyze, plan, or apply (default)."
    required: false
  preset:
    description: size@1 (implicit default), or none. Single-rule shorthand does not implicitly add size rules.
    required: false
  config:
    description: Explicit policy file. Loaded from the PR base by default; no workspace discovery.
    required: false
  policy:
    description: Inline YAML/JSON policy from a trusted workflow, mutually exclusive with config.
    required: false
  policy-source:
    description: base (default), pinned, or workspace. Workspace policy is read-only in Actions.
    required: false
  policy-ref:
    description: "Full commit SHA required by policy-source: pinned."
    required: false
  policy-repository:
    description: "Optional owner/repository for policy-source: pinned."
    required: false
  rule:
    description: Select one declared rule. Absent selects all; sync-labels selects its definitions only.
    required: false
  metric:
    description: Standard measure alias or metrics.<id>, default changed. With full policy, selects numeric output
      only. Alternative to formula.
    required: false
  threshold:
    description: Typed numeric threshold for a generated rule; default comparison gte.
    required: false
  comparison:
    description: "Threshold comparison: gt, gte, lt, lte, eq, or ne."
    required: false
  files:
    description: "Threshold quantifier: any or all included files."
    required: false
  scope:
    description: Named scope for a standard measure, not rebinding a named formula.
    required: false
  path:
    description: Newline-separated rename-aware path alternatives for a shortcut.
    required: false
  exclude:
    description: Newline-separated exclusion patterns; no implicit blacklist.
    required: false
  include-only:
    description: Newline-separated inclusion alternatives.
    required: false
  force-include:
    description: Newline-separated overrides of exclusions.
    required: false
  exclude-mode:
    description: append (default) or replace for the exclusion list.
    required: false
  include-only-mode:
    description: append (default) or replace for the inclusion list.
    required: false
  force-include-mode:
    description: append (default) or replace for the force-inclusion list.
    required: false
  label:
    description: Label assigned by a generated threshold/condition rule.
    required: false
  remove-label-when-false:
    description: true (default) or false for generated label removal on a resolved false decision.
    required: false
  definitions:
    description: "Assignment apply: ensure (default), none, verify, sync. Definition apply: sync (default) or ensure."
    required: false
  formula:
    description: Numeric detail expression for a generated metric; with full policy, selects numeric output only.
      Alternative to metric.
    required: false
  condition:
    description: Boolean detail expression for a generated rule. Alternative to threshold/comparison/files.
    required: false
  parameters:
    description: JSON object of typed parameter bindings. Values are data, never detail source.
    required: false
  report-path:
    description: Full report destination, never input. Defaults to a unique runner-temporary file.
    required: false
  plan-path:
    description: Full desired plan destination in plan/apply mode, never input.
    required: false
  effects-path:
    description: Full provider observation journal destination, including partial writes.
    required: false
  summary:
    description: true (default) or false. Write a workflow summary without posting a PR comment.
    required: false
  comment-template:
    description: Explicit generated comment template; requires comment-mode and a condition/threshold.
    required: false
  comment-mode:
    description: Explicit create, once, upsert, or once-per-transition comment lifecycle.
    required: false
  comment-author:
    description: Expected bot login for owned-comment readback. Default github-actions[bot].
    required: false
  comment-author-id:
    description: Optional positive numeric identity for owned-comment readback.
    required: false
  occasion-id:
    description: Stable workflow occasion for create comments; defaults to run ID plus Action step identity.
    required: false
