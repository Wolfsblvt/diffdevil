<script type="application/json" id="nyx-r4-data"><!-- STATE_DATA --></script>
<script>
(() => {
  const root = document.getElementById('nyx-brief-revision4');
  const data = JSON.parse(document.getElementById('nyx-r4-data').textContent);
  const body = document.getElementById('nyx-brief-body');
  const content = document.getElementById('nyx-r4-content');
  const evidence = document.getElementById('nyx-r4-evidence');
  const width = document.getElementById('nyx-r4-width');
  const source = document.getElementById('nyx-r4-markdown');
  const status = document.getElementById('nyx-r4-status');
  function render() {
    const current = data.states[evidence.value + '/' + content.value];
    body.innerHTML = current.html;
    source.value = current.markdown;
    if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    root.querySelector('.nyx-comment').dataset.width = width.value;
    status.textContent = content.selectedOptions[0].textContent + ' · ' + evidence.value;
  }
  [content, evidence].forEach(field => field.addEventListener('change', render));
  width.addEventListener('change', () => { root.querySelector('.nyx-comment').dataset.width = width.value; });
  body.addEventListener('click', event => {
    const link = event.target.closest('a');
    if (!link) return;
    event.preventDefault();
    status.textContent = 'Synthetic example link: ' + link.textContent + '.';
  });
  render();
})();
</script>
