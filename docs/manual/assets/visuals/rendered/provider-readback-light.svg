<tspan class="text-inner-tspan">stop;</tspan><tspan class="text-inner-tspan"> do</tspan><tspan class="text-inner-tspan"> not</tspan></tspan><tspan x="0" y="3.2em" class="text-outer-tspan row" dy="1.1em"><tspan class="text-inner-tspan">remove</tspan><tspan class="text-inner-tspan"> or</tspan><tspan class="text-inner-tspan"> claim</tspan></tspan><tspan x="0" y="4.3em" class="text-outer-tspan row" dy="1.1em"><tspan class="text-inner-tspan">success</tspan></tspan></text></g></g><g id="dd-provider-readback-light-flowchart-remove-5" class="node default" data-look="neo" transform="translate(360 479.9)"><rect width="144" height="117" x="-72" y="-58.5" class="basic label-container" rx="12" ry="12"/><g class="label" transform="translate(0 -46.5)"><rect/><rect class="background" style="stroke:none"/><text y="-10.1"><tspan x="0" y="-.1em" class="text-outer-tspan row" dy="1.1em"><tspan class="text-inner-tspan">If</tspan><tspan class="text-inner-tspan"> the</tspan><tspan class="text-inner-tspan"> addition</tspan><tspan class="text-inner-tspan"> is</tspan></tspan><tspan x="0" y="1em" class="text-outer-tspan row" dy="1.1em"><tspan class="text-inner-tspan">observed:</tspan></tspan><tspan x="0" y="2.1em" class="text-outer-tspan row" dy="1.1em"><tspan class="text-inner-tspan">remove</tspan><tspan class="text-inner-tspan"> the</tspan></tspan><tspan x="0" y="3.2em" class="text-outer-tspan row" dy="1.1em"><tspan class="text-inner-tspan">obsolete</tspan></tspan><tspan x="0" y="4.3em" class="text-outer-tspan row" dy="1.1em"><tspan class="text-inner-tspan">managed</tspan><tspan class="text-inner-tspan"> label,</tspan></tspan><tspan x="0" y="5.4em" class="text-outer-tspan row" dy="1.1em"><tspan class="text-inner-tspan">then</tspan><tspan class="text-inner-tspan"> read</tspan><tspan class="text-inner-tspan"> back</tspan></tspan></text></g></g><g id="dd-provider-readback-light-flowchart-success-6" class="node default ok" data-look="neo" transform="translate(268 629.2)"><rect width="144" height