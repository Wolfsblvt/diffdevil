<svg xmlns="http://www.w3.org/2000/svg" id="dd-provider-readback-light" width="528" height="731" class="flowchart" style="font-family:&quot;IBM Plex Sans&quot;,ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif;font-size:14px;fill:#161b24;max-width:528px" viewBox="4 4 528 730.2" role="img" preserveAspectRatio="xMidYMid meet" data-appearance="light" aria-labelledby="acknowledgment-provider-readback-and-partial-rec-light-title acknowledgment-provider-readback-and-partial-rec-light-description"><title id="acknowledgment-provider-readback-and-partial-rec-light-title">Acknowledgment, provider readback, and partial recovery</title><desc id="acknowledgment-provider-readback-and-partial-rec-light-description">The applying host reads current managed labels, records a verified no-op when the desired state already exists, and otherwise requests the required addition. A clear or ambiguous response is followed by provider observation before any retry or removal. Earlier verified work remains real when a later operation fails; the result is partial, not rolled back.</desc><style>@keyframes edge-animation-frame{0%{stroke-dashoffset:0}}@keyframes dash{to{stroke-dashoffset:0}}#dd-provider-readback-light .edge-thickness-normal{stroke-width:2px}#dd-provider-readback-light .edge-pattern-solid{stroke-dasharray:0}#dd-provider-readback-light .marker{fill:#484d58;stroke:#484d58}#dd-provider-readback-light .marker.cross{stroke:#484d58}#dd-provider-readback-light .label,#dd-provider-readback-light svg{font-family:&quot;IBM Plex Sans&quot;,ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif}#dd-provider-readback-light svg{font-size:14px}#dd-provider-readback-light .label{color:#161b24}#dd-provider-readback-light .label text{fill:#161b24;color:#161b24}#dd-provider-readback-light .node circle,#dd-provider-readback-light .node path,#dd-provider-readback-light .node rect{fill:#fff;stroke:#aa167d;stroke-width:2px}#dd-provider-readback-light .node .label text{text-anchor:middle}#dd-provider-readback-light .node .label{text-align:center}#dd-provider-readback-light .flowchart-link{stroke:#484d58;fill:none}#dd-provider-readback-light [data-look=neo].node circle,#dd-provider-readback-light [data-look=neo].node rect{stroke:url(#dd-provider-readback-light-gradient);filter:url(#dd-provider-readback-light-drop-shadow)}#dd-provider-readback-light [data-look=neo].node path{stroke:url(#dd-provider-readback-light-gradient);stroke-width:2px}#dd-provider-readback-light .node .label-container,#dd-provider-readback-light .node circle.basic,#dd-provider-readback-light .node path.basic,#dd-provider-readback-light .node rect.basic{fill:url(#dd-light-node)#fff!important}#dd-provider-readback-light .node.focus circle,#dd-provider-readback-light .node.focus path,#dd-provider-readback-light .node.focus rect{fill:url(#dd-light-focus)#f2f3f7!important;stroke:#e54eaf!important}#dd-provider-readback-light .node.bad .label,#dd-provider-readback-light .node.bad text,#dd-provider-readback-light .node.focus .label,#dd-provider-readback-light .node.focus text,#dd-provider-readback-light .node.ok .label,#dd-provider-readback-light .node.ok text{color:#161b24!important;fill:#161b24!important}#dd-provider-readback-light .node.ok circle,#dd-provider-readback-light .node.ok path,#dd-provider-readback-light .node.ok rect{fill:url(#dd-light-ok)#fff!important;stroke:#1f7a4d!important}#dd-provider-readback-light .node.bad circle,#dd-provider-readback-light .node.bad path,#dd-provider-readback-light .node.bad rect{fill:url(#dd-light-bad)#fff!important;stroke:#b3261e!important}#dd-provider-readback-light :root{--mermaid-font-family:&quot;IBM Plex Sans&quot;,ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif}</style><marker id="dd-provider-readback-light_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" markerHeight="14" markerUnits="userSpaceOnUse" markerWidth="10.5" orient="auto" refX="11.5" refY="7" viewBox="0 0 11.5 14"><path d="m0 0 1