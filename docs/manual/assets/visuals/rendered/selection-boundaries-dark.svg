<svg xmlns="http://www.w3.org/2000/svg" id="dd-selection-boundaries-dark" width="344" height="921" class="flowchart" style="font-family:&quot;IBM Plex Sans&quot;,ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif;font-size:14px;fill:#f0f2f5;max-width:344px" viewBox="4 4 344 921" role="img" preserveAspectRatio="xMidYMid meet" data-appearance="dark" aria-labelledby="global-and-scoped-file-selection-have-different--dark-title global-and-scoped-file-selection-have-different--dark-description"><title id="global-and-scoped-file-selection-have-different--dark-title">Global and scoped file selection have different boundaries</title><desc id="global-and-scoped-file-selection-have-different--dark-description">The observed comparison retains every observed file. Global forceInclude, includeOnly, and exclude determine the globally eligible population. Each named scope begins only from that population, applies a hard includeOnly boundary, and may use local forceInclude only against local exclusions. A globally excluded lockfile remains observed but cannot be reintroduced by its scope.</desc><style>@keyframes edge-animation-frame{0%{stroke-dashoffset:0}}@keyframes dash{to{stroke-dashoffset:0}}#dd-selection-boundaries-dark .edge-thickness-normal{stroke-width:2px}#dd-selection-boundaries-dark .edge-pattern-solid{stroke-dasharray:0}#dd-selection-boundaries-dark .marker{fill:#b4b7be;stroke:#b4b7be}#dd-selection-boundaries-dark .marker.cross{stroke:#b4b7be}#dd-selection-boundaries-dark .label,#dd-selection-boundaries-dark svg{font-family:&quot;IBM Plex Sans&quot;,ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif}#dd-selection-boundaries-dark svg{font-size:14px}#dd-selection-boundaries-dark .label{color:#f0f2f5}#dd-selection-boundaries-dark .label text{fill:#f0f2f5;color:#f0f2f5}#dd-selection-boundaries-dark .node circle,#dd-selection-boundaries-dark .node path,#dd-selection-boundaries-dark .node rect{fill:#1d222c;stroke:#f061ba;stroke-width:2px}#