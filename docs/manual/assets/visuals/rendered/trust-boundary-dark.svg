f" flood-opacity=".06" stdDeviation="0"/></filter></defs><defs><filter id="dd-trust-boundary-dark-drop-shadow-small" width="150%" height="150%"><feDropShadow dx="2" dy="2" flood-color="#fff" flood-opacity=".06" stdDeviation="0"/></filter></defs><linearGradient id="dd-trust-boundary-dark-gradient" x1="0%" x2="100%" y1="0%" y2="0%" gradientUnits="objectBoundingBox"><stop offset="0%" stop-color="#f061ba"/><stop offset="100%" stop-color="#9fc4ff"/></linearGradient></svg>
