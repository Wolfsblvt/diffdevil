<svg xmlns="http://www.w3.org/2000/svg" id="dd-trust-boundary-dark" width="365" height="355" class="flowchart" style="font-family:&quot;IBM Plex Sans&quot;,ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif;font-size:14px;fill:#f0f2f5;max-width:364.6666564941406px" viewBox="4 4 364.667 354.6" role="img" preserveAspectRatio="xMidYMid meet" data-appearance="dark" aria-labelledby="proposed-comparison-data-and-trusted-policy-rema-dark-title proposed-comparison-data-and-trusted-policy-rema-dark-description"><title id="proposed-comparison-data-and-trusted-policy-rema-dark-title">Proposed comparison data and trusted policy remain separate</title><desc id="proposed-comparison-data-and-trusted-policy-rema-dark-description">A pull request's proposed head supplies comparison data. The privileged applying route takes instructions and referenced templates only from an immutable trusted base, a deliberately pinned revision, or built-in policy. Proposed policy has no route into privileged instruction execution.</desc><style>@keyframes edge-animation-frame{0%{stroke-dashoffset:0}}@keyframes dash{to{stroke-dashoffset:0}}#dd-trust-boundary-dark .edge-thickness-normal{stroke-width:2px}#dd-trust-boundary-dark .edge-pattern-solid{stroke-dasharray:0}#dd-trust-boundary-dark .marker{fill:#b4b7be;stroke:#b4b7be}#dd-trust-boundary-dark .marker.cross{stroke:#b4b7be}#dd-trust-boundary-dark .label,#dd-trust-boundary-dark svg{font-family:&quot;IBM Plex Sans&quot;,ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif}#dd-trust-boundary-dark svg{font-size:14px}#dd-trust-boundary-dark .label{color:#f0f2f5}#dd-trust-boundary-dark .label text{fill:#f0f2f5;color:#f0f2f5}#dd-trust-boundary-dark .node circle,#dd-trust-boundary-dark .node path,#dd-trust-boundary-dark .node rect{fill:#1d222c;stroke:#f061ba;stroke-width:2px}#dd-trust-boundary-dark .node .label text{text-anchor:middle}#dd-trust-boundary-dark .node .label{text-align:center}#dd-trust-boundary-dark .flowchart