<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" class="marks" viewBox="0 0 600 280" role="img" preserveAspectRatio="xMidYMid meet" data-appearance="light" aria-labelledby="bounded-and-exact-evidence-against-policy-thresh-light-title bounded-and-exact-evidence-against-policy-thresh-light-description"><title id="bounded-and-exact-evidence-against-policy-thresh-light-title">Bounded and exact evidence against policy thresholds</title><desc id="bounded-and-exact-evidence-against-policy-thresh-light-description">The PR-files edition proves a file-scoped Changed interval from 8,679 through 11,330. It crosses 9,500, so that policy holds, but stays entirely below 12,000, so that band resolves. The raw-diff edition establishes exact 9,603.</desc><path fill="#fbfcfe" d="M0 0h600v280H0z"/><g fill="none" class="mark-group role-frame root"><path d="M8 43h580v188H8Z" class="background"/><g class="mark-group role-axis"><path stroke="#d8dbe0" stroke-opacity=".8" d="M118.5 43.5v188m139-188v188m138-188v188m138-188v188" class="mark-rule role-axis-grid" pointer-events="none"/></g><g fill="#484d58" class="mark-group role-axis" font-family="&quot;IBM Plex Sans&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="12" pointer-events="none" text-anchor="middle"><g class="mark-text role-axis-label"><text transform="translate(118.976 247.5)">9,000</text><text transform="translate(257.071 247.5)">10,000</text><text transform="translate(395.167 247.5)">11,000</text><text transform="translate(533.262 247.5)">12,000</text></g><text class="mark-text role-axis-title" font-weight="500" transform="translate(298.5 270.5)">file-scoped replacement-aware Changed lines</text></g><g stroke-width="1.5" class="mark-rule role-mark threshold_lines_marks"><path stroke="#8a5a12" stroke-dasharray="2,3" d="M187.524 43v188"/><path stroke="#1f7a4d" stroke-dasharray="7,4" d="M532.762 43v188"/></g><g class="mark-text role-mark held_threshold_label_marks"><text fill="#8a5a12" font-family="&quot;IBM Plex Sans&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="11.5" font-weight="600" transform="translate(192.524 54)">9,500 · interval crosses · held</text></g><g class="mark-text role-mark resolved_threshold_label_marks"><text fill="#1f7a4d" font-family="&quot;IBM Plex Sans&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="11.5" font-weight="600" text-anchor="end" transform="translate(527.762 72)">12,000 · interval below · resolved</text></g><g class="mark-text role-mark edition_labels_marks" font-family="&quot;IBM Plex Sans&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="12" font-weight="600"><text fill="#8a5a12" transform="translate(13.524 75.7)">PR-files edition · bounded</text><text fill="#1f7a4d" transform="translate(13.524 169.7)">Raw-diff edition · exact</text></g><g class="mark-rule role-mark bounded_interval_marks"><path stroke="#8a5a12" stroke-linecap="round" stroke-width="9" d="M74.148 94.7h366.09"/></g><g fill="#8a5a12" class="mark-rect role-mark bounded_endpoints_marks"><path d="M73.148 83.7h2v22h-2Z" opacity=".7"/><path d="M439.238 83.7h2v22h-2Z" opacity=".7"/></g><g fill="#8a5a12" class="mark-text role-mark bounded_endpoint_labels_marks" font-family="&quot;IBM Plex Sans&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="12" font-weight="600" text-anchor="middle"><text transform="translate(74.148 113.7)">8,679</text><text transform="translate(440.238 113.7)">11,330</text></g><g class="mark-symbol role-mark exact_point_marks"><path fill="#1f7a4d" stroke="#fbfcfe" stroke-width="2" d="m195.229 188.7 6.519-6.519 6.519 6.519-6.52 6.519Z" opacity=".7"/></g><g class="mark-text role-mark exact_label_marks"><text fill="#1f7a4d" font-family="&quot;IBM Plex Sans&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="12"