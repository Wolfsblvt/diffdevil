<svg xmlns="http://www.w3.org/2000/svg" width="280" height="294" class="marks" viewBox="0 0 280 294" role="img" preserveAspectRatio="xMidYMid meet" data-appearance="light" aria-labelledby="bounded-and-exact-evidence-against-policy-thresh-light-title bounded-and-exact-evidence-against-policy-thresh-light-description"><title id="bounded-and-exact-evidence-against-policy-thresh-light-title">Bounded and exact evidence against policy thresholds</title><desc id="bounded-and-exact-evidence-against-policy-thresh-light-description">The PR-files edition proves a file-scoped Changed interval from 8,679 through 11,330. It crosses 9,500, so that policy holds, but stays entirely below 12,000, so that band resolves. The raw-diff edition establishes exact 9,603.</desc><path fill="#fbfcfe" d="M0 0h280v294H0z"/><g fill="none" class="mark-group role-frame root"><path d="M8 43h260v202H8Z" class="background"/><g class="mark-group role-axis"><path stroke="#d8dbe0" stroke-opacity=".8" d="M58.5 43.5v202m61-202v202m62-202v202m62-202v202" class="mark-rule role-axis-grid" pointer-events="none"/></g><g fill="#484d58" class="mark-group role-axis" font-family="&quot;IBM Plex Sans&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="12" pointer-events="none" text-anchor="middle"><g class="mark-text role-axis-label"><text transform="translate(58.024 261.5)">9,000</text><text transform="translate(119.929 261.5)">10,000</text><text transform="translate(181.833 261.5)">11,000</text><text transform="translate(243.738 261.5)">12,000</text></g><text class="mark-text role-axis-title" font-weight="500" transform="translate(138.5 284.5)">file-scoped Changed lines</text></g><g stroke-width="1.5" class="mark-rule role-mark threshold_lines_marks"><path stroke="#8a5a12" stroke-dasharray="2,3" d="M88.476 43v202"/><path stroke="#1f7a4d" stroke-dasharray="7,4" d="M243.238 43v202"/></g><g class="mark-text role-mark held_threshold_label_marks"><text fill="#8a5a12" font-family="&quot;IBM Plex Sans&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="10.5" font-weight="600" transform="translate(93.476 53)">9.5k · crosses · held</text></g><g class="mark-text role-mark resolved_threshold_label_marks"><text fill="#1f7a4d" font-family="&quot;IBM Plex Sans&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="10.5" font-weight="600" text-anchor="end" transform="translate(238.238 71)">12k · below · resolved</text></g><g class="mark-text role-mark edition_labels_marks" font-family="&quot;IBM Plex Sans&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="12" font-weight="600"><text fill="#8a5a12" transform="translate(10.476 79.55)">PR files · bounded</text><text fill="#1f7a4d" transform="translate(10.476 180.55)">Raw diff · exact</text></g><g class="mark-rule role-mark bounded_interval_marks"><path stroke="#8a5a12" stroke-linecap="round" stroke-width="9" d="M37.652 98.55h164.11"/></g><g fill="#8a5a12" class="mark-rect role-mark bounded_endpoints_marks"><path d="M36.652 87.55h2v22h-2Z" opacity=".7"/><path d="M200.762 87.55h2v22h-2Z" opacity=".7"/></g><g fill="#8a5a12" class="mark-text role-mark bounded_endpoint_labels_marks" font-family="&quot;IBM Plex Sans&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="12" font-weight="600" text-anchor="middle"><text transform="translate(37.652 117.55)">8,679</text><text transform="translate(201.762 117.55)">11,330</text></g><g class="mark-symbol role-mark exact_point_marks"><path fill="#1f7a4d" stroke="#fbfcfe" stroke-width="2" d="m88.333 199.55 6.52-6.519 6.518 6.519-6.519 6.519Z" opacity=".7"/></g><g class="mark-text role-mark exact_label_marks"><text fill="#1f7a4d" font-family="&quot;IBM Plex Sans&quot;, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="12" font-weight="700" text-anchor="middle" transform="translate(94.852 221.55)">9,603</text></g></g></svg>
