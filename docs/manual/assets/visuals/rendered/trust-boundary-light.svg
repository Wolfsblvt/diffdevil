<svg xmlns="http://www.w3.org/2000/svg" id="dd-trust-boundary-light" width="365" height="355" class="flowchart" style="font-family:&quot;IBM Plex Sans&quot;,ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif;font-size:14px;fill:#161b24;max-width:364.6666564941406px" viewBox="4 4 364.667 354.6" role="img" preserveAspectRatio="xMidYMid meet" data-appearance="light" aria-labelledby="proposed-comparison-data-and-trusted-policy-rema-light-title proposed-comparison-data-and-trusted-policy-rema-light-description"><title id="proposed-comparison-data-and-trusted-policy-rema-light-title">Proposed comparison data and trusted policy remain separate</title><desc id="proposed-comparison-data-and-trusted-policy-rema-light-description">A pull request's proposed head supplies comparison data. The privileged applying route takes instructions and referenced templates only from an immutable trusted base, a deliberately pinned revision, or built-in policy. Proposed policy has no route into privileged instruction execution.</desc><style>@keyframes edge-animation-frame{0%{stroke-dashoffset:0}}@keyframes dash{to{stroke-dashoffset:0}}#dd-trust-boundary-light .edge-thickness-normal{stroke-width:2px}#dd-trust-boundary-light .edge-pattern-solid{stroke-dasharray:0}#dd-trust-boundary-light .marker{fill:#484d58;stroke:#484d58}#dd-trust-boundary-light .marker.cross{stroke:#484d58}#dd-trust-boundary-light .label,#dd-trust-boundary-light svg{font-family:&quot;IBM Plex Sans&quot;,ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif}#dd-trust-boundary-light svg{font-size:14px}#dd-trust-boundary-light .label{color:#161b24}#dd-trust-boundary-light .label text{fill:#161b24;color:#161b24}#dd-trust-boundary-light .node circle,#dd-trust-boundary-light .node path,#dd-trust-boundary-light .node rect{fill:#fff;stroke:#aa167d;stroke-width:2px}#dd-trust-boundary-light .node .label text{text-anchor:middle}#dd-trust-boundary-light .node .label{text-align:center}#dd-trust-boundar