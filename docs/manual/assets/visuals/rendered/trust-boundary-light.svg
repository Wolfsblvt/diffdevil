.1em"><tspan class="text-inner-tspan">are</tspan><tspan class="text-inner-tspan"> untrusted</tspan></tspan></text></g></g><g id="dd-trust-boundary-light-flowchart-blocked-3" class="node default bad" data-look="neo" transform="translate(288.667 284.4)"><rect width="144" height="70.8" x="-72" y="-35.4" class="basic label-container" rx="12" ry="12"/><g class="label" transform="translate(0 -23.4)"><rect/><rect class="background" style="stroke:none"/><text y="-10.1"><tspan x="0" y="-.1em" class="text-outer-tspan row" dy="1.1em"><tspan class="text-inner-tspan">Rejected</tspan><tspan class="text-inner-tspan"> as</tspan></tspan><tspan x="0" y="1em" class="text-outer-tspan row" dy="1.1em"><tspan class="text-inner-tspan">privileged</tspan></tspan><tspan x="0" y="2.1em" class="text-outer-tspan row" dy="1.1em"><tspan class="text-inner-tspan">instructions</tspan></tspan></text></g></g><g id="dd-trust-boundary-light-flowchart-analyze-4" class="node default focus" data-look="neo" transform="translate(104.667 165.9)"><rect width="144" height="86.2" x="-72" y="-43.1" class="basic label-container" rx="12" ry="12"/><g class="label" style="color:#161b24!important;fill:#161b24!important" transform="translate(0 -31.1)"><rect/><rect class="background" style="stroke:none"/><text y="-10.1" style="color:#161b24!important;fill:#161b24!important"><tspan x="0" y="-.1em" class="text-outer-tspan row" dy="1.1em"><tspan class="text-inner-tspan">Analyze</tspan></tspan><tspan x="0" y="1em" class="text-outer-tspan row" dy="1.1em"><tspan class="text-inner-tspan">proposed</tspan><tspan class="text-inner-tspan"> data</tspan></tspan><tspan x="0" y="2.1em" class="text-outer-tspan row" dy="1.1em"><tspan class="text-inner-tspan">under</tspan><tspan class="text-inner-tspan"> trusted</tspan></tspan><tspan x="0" y="3.2em" class="text-outer-tspan row" dy="1.1em"><tspan class="text-inner-tspan">policy</tspan></tspan></text></g></g><g id="dd-trust-boundary-light-flowchart-apply-5" class="node default ok" data-look