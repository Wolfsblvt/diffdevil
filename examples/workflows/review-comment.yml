name: Change summary
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: diffdevil-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: Wolfsblvt/diffdevil@v1
        with:
          config: .github/diffdevil-comment.yml
          policy-source: base
