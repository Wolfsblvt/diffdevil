name: Verify
on:
  push:
    branches: [main, docs/public-manual]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # Windows 22 took 28m16s; Windows 24 spent about 6m installing and 27m42s
    # verifying before package and Action consumers. Keep the full criterion finite.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '22'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed metadata 2026-10-15
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, reviewed metadata 2026-10-15
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Show actual toolchain
        run: |
          node --version
          npm --version
          git --version
      - name: Restore locked project packages
        run: npm ci --cache artifacts/dependencies/npm-cache --ignore-scripts --no-audit --no-fund
      - name: Ordinary verification and generated Action parity
        run: npm run verify
      - name: Complete supplied conformance
        run: npm run test:conformance
      - name: Installed npm consumer from registry
        env:
          DIFFDEVIL_PACKAGE_INSTALL_ONLINE: '1'
        run: npm run test:package
      - name: Install-free Action consumers
        run: npm run test:actions
