name: FAQ website
on:
  pull_request:
    paths:
      - 'apps/website/**'
      - 'docs/**'
      - 'packages/design/**'
      - 'tools/website-*.mjs'
      - 'package*.json'
      - '.github/workflows/faq.yml'
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'docs/**'
      - 'packages/design/**'
      - 'tools/website-*.mjs'
      - 'package*.json'
      - '.github/workflows/faq.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faq-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Built FAQ / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Restore locked project packages
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the real website and search index
        env:
          DIFFDEVIL_SITE_ORIGIN: https://diffdevil.dev
        run: npm run website:build
      - name: Install the repository-selected Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise FAQ navigation, links, search and responsive layout
        run: node apps/website/qa/faq.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: faq-browser-evidence
          path: artifacts/website/faq-qa/
          if-no-files-found: ignore
