name: FAQ website
on:
  pull_request:
    paths:
      - 'apps/website/**'
      - 'docs/**'
      - 'design/**'
      - 'tools/website-*.mjs'
      - 'package*.json'
      - '.github/workflows/faq.yml'
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'docs/**'
      - 'design/**'
      - 'tools/website-*.mjs'
      - 'package*.json'
      - '.github/workflows/faq.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faq-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Built FAQ / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Restore locked project packages
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the real website and search index
        env:
          DIFFDEVIL_SITE_ORIGIN: https://diffdevil.dev
        run: npm run website:build
      - name: Install the repository-selected Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise FAQ navigation, links, search and responsive layout
        run: node apps/website/qa/faq.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: faq-browser-evidence
          path: artifacts/website/faq-qa/
          if-no-files-found: ignore
