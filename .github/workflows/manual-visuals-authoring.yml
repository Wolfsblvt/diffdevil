name: Manual visual authoring

on:
  push:
    branches: [docs/visual-explanations-shot-2]
    paths:
      - '.github/workflows/manual-visuals-authoring.yml'

permissions:
  contents: read

concurrency:
  group: manual-visual-authoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render selected manual visuals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Restore locked root packages
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare the accepted manual consumer graph
        run: npm --prefix apps/manual run toolchain
      - name: Install Chromium for the repository renderer
        run: npx --no-install playwright install --with-deps chromium
      - name: Render, optimize, and validate the exact sources
        run: npm --prefix apps/manual run render:visuals
      - name: Confirm the generated set is internally valid
        run: npm --prefix apps/manual run validate:visuals
      - name: Preserve generated source-bound artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: manual-visuals-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          path: |
            docs/manual/assets/visuals/rendered/
            artifacts/manual/visuals/
