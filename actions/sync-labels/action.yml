  preset:
    description: size@1 (implicit default), or none. Single-rule shorthand does not implicitly add size rules.
    required: false
  config:
    description: Explicit policy file. Loaded from the PR base by default; no workspace discovery.
    required: false
  policy:
    description: Inline YAML/JSON policy from a trusted workflow, mutually exclusive with config.
    required: false
  policy-source:
    description: base (default), pinned, or workspace. Workspace policy is read-only in Actions.
    required: false
  policy-ref:
    description: "Full commit SHA required by policy-source: pinned."
    required: false
  policy-repository:
    description: "Optional owner/repository for policy-source: pinned."
    required: false
  rule:
    description: Select one declared rule. Absent selects all; sync-labels selects its definitions only.
    required: false
  exclude:
    description: Newline-separated exclusion patterns; no implicit blacklist.
    required: false
  include-only:
    description: Newline-separated inclusion alternatives.
    required: false
  force-include:
    description: Newline-separated overrides of exclusions.
    required: false
  exclude-mode:
    description: append (default) or replace for the exclusion list.
    required: false
  include-only-mode:
    description: append (default) or replace for the inclusion list.
    required: false
  force-include-mode:
    description: append (default) or replace for the force-inclusion list.
    required: false
  definitions:
    description: "Assignment apply: ensure (default), none, verify, sync. Definition apply: sync (default) or ensure."
    required: false
  effects-path:
    description: Full provider observation journal destination, including partial writes.
    required: false
  summary:
    description: true (default) or false. Write a workflow summary without posting a PR comment.
    required: false
  operation:
    description: verify (default, read-only) or apply declared repository label definitions.
    required: false
outputs:
  effects-changed:
    description: Count of operations with verified changed readback; empty when effects were not applied.
  effects-status:
    description: effects-status; see the Action manual for exact, bounded, unavailable and not-applied values.
  effects-path:
    description: effects-path; see the Action manual for exact, bounded, unavailable and not-applied values.
